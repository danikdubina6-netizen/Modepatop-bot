name: Scheduled Runner Check

on:
  schedule:
    # Запуск каждые 5 часов (в 0 минут, каждые 5 часов: 0, 5, 10, 15 и т.д.)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Позволяет также запускать этот процесс вручную кнопкой на GitHub

jobs:
  run-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run bot script test
      run: |
        # Здесь проверяется работоспособность скрипта
        echo "Раннер запущен по расписанию."
